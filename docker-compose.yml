services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cpm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://app_user:app_pass@db:5432/cpm
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@db:5432/cpm
      JWT_SECRET: change-me-in-prod
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on: [api]

volumes:
  pgdata:
