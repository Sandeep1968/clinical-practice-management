name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cpm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cpm
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/cpm
      JWT_SECRET: ci-only-secret-not-used-in-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: api/package-lock.json }

      - name: Install
        working-directory: api
        run: npm install

      - name: Migrate + seed
        working-directory: api
        run: npm run migrate && npm run seed

      - name: Unit tests
        working-directory: api
        run: npm test

      # The critical gate: cross-tenant / cross-clinician / portal isolation.
      # If this fails, PHI can leak between practices — do not merge.
      - name: Isolation tests
        working-directory: api
        run: node --test test/isolation.test.js

      - name: Dependency audit
        working-directory: api
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        working-directory: web
        run: npm install
      - name: Build
        working-directory: web
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed secrets or .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env committed"; exit 1; fi
          if grep -rInE "(AKIA[0-9A-Z]{16}|sk_live_|SG\.[A-Za-z0-9_-]{20,})" \
               --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::possible live credential committed"; exit 1
          fi
          echo "no obvious secrets found"
